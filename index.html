<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless-runner</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js"></script>
</head>

<body>
    <h1>Endless-runner</h1>
    <div id="gameArea">
        <canvas id="road"></canvas>
        <button id="replayBtn" type="button">Replay</button>
    </div>
    <div id="touchControls" aria-label="Game controls">
        <button type="button" data-action="left" aria-label="Move left">&#8592;</button>
        <button type="button" data-action="jump" aria-label="Jump">&#8593;</button>
        <button type="button" data-action="right" aria-label="Move right">&#8594;</button>
    </div>
    <div id="score">Score: 0</div>
    <div id="gameOver">Game Over</div>
</body>

</html>
